<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DevShop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 900px;
            max-width: 100%;
        }
        .form-section {
            padding: 40px;
        }
        .brand-section {
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-custom {
            background-color: #4f46e5;
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-weight: 500;
        }
        .btn-custom:hover {
            background-color: #4338ca;
            color: white;
        }
        /* Django form inputs ko styling dene ke liye */
        .form-section input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9fafb;
        }
        .form-section label {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .helptext, ul.errorlist {
            font-size: 12px;
            color: #6b7280;
            list-style: none;
            padding: 0;
            margin-bottom: 10px;
        }
        ul.errorlist {
            color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content: center;">
        <div class="row card-container m-3">
            <!-- Left Side: Signup Form -->
            <div class="col-md-6 form-section d-flex flex-column justify-content-center">
                <h3 class="fw-bold mb-4" style="color: #1f2937;">CREATE ACCOUNT</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-custom w-100 mt-2">Sign Up</button>
                </form>

                <p class="mt-4 text-center text-muted" style="font-size: 14px;">
                    Already have an account? <a href="{% url 'store:login' %}" class="text-decoration-none fw-bold" style="color: #4f46e5;">Sign In</a>
                </p>
                
                <div class="text-center mt-3 text-muted" style="font-size: 12px;">
                    Copyright © 2026 DevShop. All rights reserved.
                </div>
            </div>

            <!-- Right Side: Brand Banner -->
            <div class="col-md-6 brand-section d-none d-md-flex">
                <div class="mb-3 p-3 bg-dark rounded-4 shadow-sm border border-secondary">
                    <span class="fs-3 fw-bold text-info">DS</span>
                </div>
                <h4 class="fw-bold mt-2">Join DevShop Today</h4>
                <p class="text-muted small mt-2" style="color: #9ca3af !important;">Equip your workspace with the best developer gear and accessories.</p>
            </div>
        </div>
    </div>

</body>
</html>
