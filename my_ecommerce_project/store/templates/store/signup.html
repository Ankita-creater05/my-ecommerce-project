{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DevShop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #f4f7f6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 20px 0; /* Upar niche thoda space dene ke liye */
    }
    .card-container {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        width: 900px;
        max-width: 100%;
    }
    .form-section {
        padding: 25px 40px; /* Padding kam ki taaki lambaai fit aaye */
    }
    .brand-section {
        background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
        color: white;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .btn-custom {
        background-color: #4f46e5;
        color: white;
        border-radius: 8px;
        padding: 10px;
        font-weight: 500;
    }
    .btn-custom:hover {
        background-color: #4338ca;
        color: white;
    }
    .form-section input {
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9fafb;
    }
    .form-section label {
        font-size: 13px;
        color: #4b5563;
        margin-bottom: 2px;
        font-weight: 500;
    }
    /* Password ke lambe instructions ko chota aur clean karne ke liye */
    .helptext {
        font-size: 11px;
        color: #6b7280;
        margin-bottom: 8px;
        display: block;
    }
    .helptext ul {
        padding-left: 15px;
        margin: 2px 0 8px 0;
    }
    ul.errorlist {
        font-size: 11px;
        color: #dc2626;
        list-style: none;
        padding: 0;
    }
</style>s
</head>
<body>

    <div class="container d-flex justify-content: center;">
        <div class="row card-container m-3">
            <!-- Left Side: Signup Form -->
            <div class="col-md-6 form-section d-flex flex-column justify-content-center">
                <h3 class="fw-bold mb-4" style="color: #1f2937;">CREATE ACCOUNT</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-custom w-100 mt-2">Sign Up</button>
                </form>

                <p class="mt-4 text-center text-muted" style="font-size: 14px;">
                    Already have an account? <a href="{% url 'store:login' %}" class="text-decoration-none fw-bold" style="color: #4f46e5;">Sign In</a>
                </p>
                
                <div class="text-center mt-3 text-muted" style="font-size: 12px;">
                    Copyright © 2026 DevShop. All rights reserved.
                </div>
            </div>

            <!-- Right Side: Brand Banner -->
<div class="col-md-6 brand-section d-none d-md-flex">
    <div class="mb-3">
        <img src="{% static 'image/chip_logo.png' %}" alt="DevShop Logo" style="width: 180px; height: 180px; object-fit: contain;">
    </div>
    <h4 class="fw-bold mt-2">Join DevShop Today</h4>
    <p class="text-muted small mt-2" style="color: #9ca3af !important;">Equip your workspace with the best developer gear and accessories.</p>
</div>
        </div>
    </div>

</body>
</html>
